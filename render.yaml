services:

  # Redis
  - type: keyvalue
    name: orbit-redis
    plan: free
    region: singapore
    ipAllowList: []

  # Auth
  - type: web
    name: orbit-auth
    plan: free
    region: singapore
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/services/auth/Dockerfile
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://orbit-two-azure.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orbit-redis
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # Chat
  - type: web
    name: orbit-chat
    plan: free
    region: singapore
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/services/chat/Dockerfile
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://orbit-two-azure.vercel.app
      - key: MONGODB_URL
        sync: false

  # Billing
  - type: web
    name: orbit-billing
    plan: free
    region: singapore
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/services/billing/Dockerfile
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://orbit-two-azure.vercel.app
      - key: MONGODB_URL
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Agent
  - type: web
    name: orbit-agent
    plan: free
    region: singapore
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/services/agent/Dockerfile
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://orbit-two-azure.vercel.app
      - key: MONGODB_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orbit-redis
          property: connectionString

      - key: AUTH_SERVICE_URL
        sync: false
      - key: CHAT_SERVICE_URL
        sync: false
      - key: BILLING_SERVICE_URL
        sync: false

      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Gateway
  - type: web
    name: orbit-gateway
    plan: free
    region: singapore
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/gateway/Dockerfile
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://orbit-two-azure.vercel.app

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orbit-redis
          property: connectionString

      - key: AUTH_SERVICE_URL
        sync: false
      - key: CHAT_SERVICE_URL
        sync: false
      - key: AGENT_SERVICE_URL
        sync: false
      - key: BILLING_SERVICE_URL
        sync: false